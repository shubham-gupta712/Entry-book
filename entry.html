<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ledger Desk</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17202a;--mut:#6b7684;--line:#e5e8ec;--pri:#0f766e;--in:#15803d;--out:#b91c1c;--warn:#b45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#app{height:100dvh;overflow:auto}
#shell{display:flex;flex-direction:column;height:100dvh}
header{flex:none;display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#0b3b38;color:#fff}
header b{font-size:15px}header small{display:block;opacity:.75;font-size:11.5px;text-transform:capitalize}
.ghost{background:transparent;color:#fff;border:1px solid #ffffff55;padding:5px 10px;border-radius:8px;font-size:12.5px}
main{flex:1;overflow-y:auto;padding:10px;width:100%;max-width:760px;margin:0 auto}
nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:7px 2px 6px;color:var(--mut);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer;min-width:0}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri);font-weight:700}
.bd,.bd2{background:#dc2626;color:#fff;border-radius:8px;font-size:10px;padding:0 5px;min-width:16px;text-align:center;line-height:16px}
nav .bd{position:absolute;top:2px;left:54%}
.bd2{margin-left:5px;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
h2,h3{margin:0 0 8px}h2{font-size:16px}h3{font-size:15px}
label{display:block;font-size:11px;color:var(--mut);margin:0 0 8px}
input,select,textarea{width:100%;min-width:0;padding:8px 9px;border:1px solid #cfd5dc;border-radius:8px;font:inherit;font-size:15px;background:#fff;color:var(--ink);margin-top:2px}
input[readonly]{background:#f1f3f5;color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.seg label{margin:0}.seg input{display:none}
.seg span{display:block;text-align:center;padding:8px;border:1px solid #cfd5dc;border-radius:8px;font-size:13.5px;color:var(--ink)}
.seg input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg.dir input[value=out]:checked+span{background:var(--out);border-color:var(--out)}
.seg.dir input[value=in]:checked+span{background:var(--in);border-color:var(--in)}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 14px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:#e8ecf0;color:var(--ink)}.btn.red{background:var(--out)}
.btn.xs{padding:4px 9px;font-size:12px;font-weight:600}.btn.ic{padding:8px 13px}
.btn.full{width:100%}.btn:disabled{opacity:.5}
.kpi{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.k{padding:7px 9px;border-left:1px solid var(--line);min-width:0}
.k:first-child{border-left:0}
.k small{display:block;color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k.in b{color:var(--in)}.k.out b{color:var(--out)}.k.warn b{color:var(--warn)}
.banner{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;font-weight:700;margin-bottom:8px}
.banner.ok{background:#dcfce7;color:var(--in)}.banner.wn{background:#fef3c7;color:var(--warn)}
.banner span{font-weight:500;opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0}
.tile b{display:block;font-size:15px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.in{color:var(--in)}.out{color:var(--out)}.muted{color:var(--mut)}.warn{color:var(--warn)}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.gh+.li,.li:first-child{border-top:0}
.li .l{min-width:0;flex:1}
.li .l>b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{display:block;color:var(--mut);font-size:11.5px}
.li .r{text-align:right;white-space:nowrap}
.li .r b{display:block}
.li.void{opacity:.45}.li.void .r b{text-decoration:line-through}
.acts{display:flex;gap:6px;margin-top:5px}
.det{font-size:12px;margin-top:3px}
.tag{display:inline-block;font-size:10.5px;background:#fef3c7;color:var(--warn);padding:1px 6px;border-radius:8px;margin-left:5px;font-weight:600}
.tag.g{background:#dcfce7;color:var(--in)}.tag.r{background:#fee2e2;color:var(--out)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px}
.chips button{flex:none;border:1px solid #cfd5dc;background:#fff;padding:5px 11px;border-radius:14px;font-size:12.5px;white-space:nowrap}
.bar{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.bar input{flex:1;margin:0;font-size:14px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filters label{margin:0}
.sub{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:8px}
.sub button{border:1px solid #cfd5dc;background:#fff;padding:8px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink)}
.sub button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.today{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.overlay{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#17202a;color:#fff;padding:9px 15px;border-radius:10px;z-index:30;max-width:92vw;display:none;font-size:13.5px}
#toast.err{background:#b91c1c}
.login{max-width:380px;margin:12vh auto;padding:0 14px}
.diff{font-size:12.5px;margin:3px 0}
.fn{font-size:11px;color:var(--mut);margin:2px 2px 8px}
.row3{display:grid;grid-template-columns:1fr 112px auto;gap:6px;align-items:end}
.row3 label{margin:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp, writeBatch, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyC5UikvaMXFoSP0AucnuYtxI_SdQ4Yw0Kw",
  authDomain: "entry-b64cb.firebaseapp.com",
  projectId: "entry-b64cb",
  storageBucket: "entry-b64cb.firebasestorage.app",
  messagingSenderId: "637411722820",
  appId: "1:637411722820:web:537f393f8b076ecc8b5e11",
  measurementId: "G-NW94RR7CC7"
};
/* ==================================================== */

const TZ = 'Asia/Kolkata';
const EDIT_WINDOW_MS = 5 * 3600e3; // must match the 5 hours in firestore.rules
const GROUPS = { small: 'Small vendors', main1: 'Main vendor 1', main2: 'Main vendor 2' };
const SHORT = { small: 'Small vendors', main1: 'Main 1', main2: 'Main 2' };
const ALL_TYPES = ['small', 'main1', 'main2'];
const DEFAULT_BANKS = ['HDFC', 'SBI', 'ICICI', 'Axis', 'Kotak', 'PNB', 'Other'];
const DEFAULT_MODES = ['UPI', 'NEFT', 'IMPS', 'RTGS', 'Cheque', 'Card'];
const LABEL = { vendorName: 'Vendor', dir: 'Direction', mode: 'Mode', bank: 'Bank', payMode: 'Pay mode', amount: 'Amount', commission: 'Commission', commType: 'Comm. type', note: 'Note', dateKey: 'Date', status: 'Status' };
const FIELDS = ['vendorId', 'vendorName', 'vendorType', 'dir', 'mode', 'bank', 'payMode', 'amount', 'commission', 'commType', 'note', 'dateKey'];

const ICON = {
  entry: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  ledger: '<path d="M12 3v18M6 21h12M5 7h14"/><path d="M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0z"/>',
  dash: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  tx: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  review: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5.2a3 3 0 010 5.6M21 20c0-2-1.2-3.6-3-4.4"/>',
  vendors: '<path d="M4 9l1-5h14l1 5M4 9h16v11H4zM9 20v-6h6v6"/>',
  more: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  edits: '<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>'
};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => '₹' + new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(n || 0);
const num = n => new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(n || 0);
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const sum = (a, f) => r2(a.reduce((s, x) => s + f(x), 0));
const keyOf = (d = new Date()) => +new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d).replace(/-/g, '');
const keyToStr = k => { const s = String(k); return `${s.slice(6)}-${s.slice(4, 6)}-${s.slice(0, 4)}`; };
const keyShort = k => { const s = String(k); return `${s.slice(6)}-${s.slice(4, 6)}-${s.slice(2, 4)}`; };
const keyToIso = k => { const s = String(k); return `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}`; };
const isoToKey = i => +String(i).replace(/-/g, '');
const dt = ts => ts?.toDate ? new Intl.DateTimeFormat('en-IN', { timeZone: TZ, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true }).format(ts.toDate()) : '…';
const tm = ts => ts?.toDate ? new Intl.DateTimeFormat('en-IN', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: true }).format(ts.toDate()) : '…';
const ms = t => t.createdAt?.toMillis?.() ?? Date.now();
const byName = (a, b) => a.name.localeCompare(b.name);
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const kpi = cells => `<div class="kpi">${cells.map(([l, v, c = '', a = '']) => `<div class="k ${c}" ${a}><small>${l}</small><b>${v}</b></div>`).join('')}</div>`;

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', err ? 6000 : 2200); }
const errMsg = e => /permission|insufficient/i.test(e?.code + ' ' + e?.message) ? 'Not allowed by the rules. If this is a new entry, check your phone date/time is correct and that you are within your permissions.' : (e?.message || String(e));
function modal(html) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="sheet">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) o.remove(); });
  document.body.appendChild(o); o.close = () => o.remove(); return o;
}

/* ---------- setup check ---------- */
const app = $('#app');
if (firebaseConfig.apiKey.startsWith('PASTE')) {
  app.innerHTML = '<div class="login"><div class="card"><h2>Setup needed</h2><p>Paste your Firebase web config at the top of the script, then reload.</p></div></div>';
  throw new Error('Firebase config missing');
}
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

/* ---------- state ---------- */
const S = { user: null, me: null, tab: null, vendors: [], cfg: { banks: DEFAULT_BANKS, modes: DEFAULT_MODES }, small: [], main: [], approvals: [], logs: [], users: [], unsubs: [], f: {}, loginMsg: '', ready: {} };
const allTx = () => [...S.small.map(t => ({ ...t, _col: 'tx_small' })), ...S.main.map(t => ({ ...t, _col: 'tx_main' }))];
const sortTx = rows => rows.sort((a, b) => b.dateKey - a.dateKey || ms(b) - ms(a));
const role = () => S.me.role;
const allowedTypes = () => role() === 'accountant' ? ['small'] : role() === 'owner' ? ALL_TYPES : [];
const visibleTypes = () => role() === 'accountant' ? ['small'] : ALL_TYPES;
const canDirect = t => role() !== 'accountant' || (t.dateKey === keyOf() && Date.now() < ms(t) + EDIT_WINDOW_MS);

/* ---------- ledger maths ---------- */
// Net = In - Out. Per vendor: opening (carried forward) + today's net = closing (carried to next day).
function ledgerFor(txs, key, types) {
  const map = {};
  const get = (id, name, type) => map[id] || (map[id] = { id, name, type, open: 0, in: 0, out: 0, given: 0, taken: 0 });
  S.vendors.forEach(v => { if (types.includes(v.type) && v.active !== false) get(v.id, v.name, v.type); });
  for (const t of txs) {
    if (t.status === 'void' || !types.includes(t.vendorType) || t.dateKey > key) continue;
    const r = get(t.vendorId, t.vendorName, t.vendorType);
    if (t.dateKey < key) r.open += t.dir === 'in' ? t.amount : -t.amount;
    else {
      if (t.dir === 'in') r.in += t.amount; else r.out += t.amount;
      if (t.commType === 'given') r.given += t.commission;
      if (t.commType === 'taken') r.taken += t.commission;
    }
  }
  return Object.values(map).map(r => ({ ...r, open: r2(r.open), in: r2(r.in), out: r2(r.out), given: r2(r.given), taken: r2(r.taken), close: r2(r.open + r.in - r.out) }));
}
function ledgerCalc(key, types) {
  const rows = ledgerFor(allTx(), key, types);
  const groups = types.map(ty => {
    const rs = rows.filter(r => r.type === ty && (r.open || r.in || r.out || r.close || r.given || r.taken)).sort(byName);
    return { ty, rs, open: sum(rs, r => r.open), in: sum(rs, r => r.in), out: sum(rs, r => r.out), given: sum(rs, r => r.given), taken: sum(rs, r => r.taken), close: sum(rs, r => r.close) };
  });
  const T = { open: sum(groups, x => x.open), in: sum(groups, x => x.in), out: sum(groups, x => x.out), close: sum(groups, x => x.close), given: sum(groups, x => x.given), taken: sum(groups, x => x.taken) };
  T.bal = Math.abs(T.close) < 0.005;
  return { groups, T };
}

/* ---------- writes ---------- */
const clean = o => JSON.parse(JSON.stringify(o, (k, v) => v === undefined ? null : v));
const mkLog = (action, x) => ({ ts: serverTimestamp(), by: S.user.uid, byName: S.me.name, role: role(), action, ...clean(x) });
const brief = d => ({ dir: d.dir, amount: d.amount, mode: d.mode, bank: d.bank || '', payMode: d.payMode || '', commission: d.commission, commType: d.commType, note: d.note || '' });

async function createTx(d, any) {
  if (!(any ? ALL_TYPES : allowedTypes()).includes(d.vendorType)) throw new Error('You cannot add entries for this vendor.');
  const col = d.vendorType === 'small' ? 'tx_small' : 'tx_main';
  const ref = doc(collection(db, col)); const b = writeBatch(db);
  const { reason, ...data } = d;
  b.set(ref, { ...data, status: 'active', editCount: 0, createdBy: S.user.uid, createdByName: S.me.name, createdAt: serverTimestamp() });
  b.set(doc(collection(db, 'logs')), mkLog('create', { col, txId: ref.id, vendorName: d.vendorName, dateKey: d.dateKey, after: brief(d) }));
  await b.commit();
}
async function changeTx(t, after, action, reason) {
  const before = {}; Object.keys(after).forEach(k => before[k] = t[k] ?? '');
  const b = writeBatch(db);
  if (canDirect(t)) {
    b.update(doc(db, t._col, t.id), { ...after, editedAt: serverTimestamp(), editedBy: S.user.uid, editedByName: S.me.name, editCount: increment(1) });
    b.set(doc(collection(db, 'logs')), mkLog(action, { col: t._col, txId: t.id, vendorName: t.vendorName, dateKey: t.dateKey, before, after }));
    await b.commit(); return 'done';
  }
  b.set(doc(collection(db, 'approvals')), { ...clean({ col: t._col, txId: t.id, vendorName: t.vendorName, dateKey: t.dateKey, before, after, reason: reason || '', requestedBy: S.user.uid, requestedByName: S.me.name, status: 'pending' }), requestedAt: serverTimestamp() });
  b.set(doc(collection(db, 'logs')), mkLog('request_edit', { col: t._col, txId: t.id, vendorName: t.vendorName, dateKey: t.dateKey, before, after, reason: reason || '' }));
  await b.commit(); return 'requested';
}
async function decide(a, ok, note) {
  const b = writeBatch(db);
  if (ok) b.update(doc(db, a.col, a.txId), { ...a.after, editedAt: serverTimestamp(), editedBy: S.user.uid, editedByName: S.me.name, editCount: increment(1) });
  b.update(doc(db, 'approvals', a.id), { status: ok ? 'approved' : 'rejected', decidedBy: S.user.uid, decidedByName: S.me.name, decidedAt: serverTimestamp(), decisionNote: note || '' });
  b.set(doc(collection(db, 'logs')), mkLog(ok ? 'approved' : 'rejected', { col: a.col, txId: a.txId, vendorName: a.vendorName, dateKey: a.dateKey, before: a.before, after: a.after, requestedByName: a.requestedByName, reason: note || '' }));
  await b.commit();
}

/* ---------- form ---------- */
function formHtml(t = {}, o = {}) {
  const v = (k, d = '') => esc(t[k] ?? d);
  return `<form autocomplete="off">
  <label>Vendor<select name="vendor" required></select></label>
  ${o.group ? '<label data-small hidden>Small vendor<select name="smallVendor"></select></label>' : ''}
  <div class="seg dir"><label><input type="radio" name="dir" value="in" ${t.dir !== 'out' ? 'checked' : ''}><span>Entry (In)</span></label><label><input type="radio" name="dir" value="out" ${t.dir === 'out' ? 'checked' : ''}><span>Exit (Out)</span></label></div>
  <div class="seg"><label><input type="radio" name="mode" value="cash" ${t.mode !== 'online' ? 'checked' : ''}><span>Cash</span></label><label><input type="radio" name="mode" value="online" ${t.mode === 'online' ? 'checked' : ''}><span>Online</span></label></div>
  <div class="row2" data-online><label>Bank<select name="bank"></select></label><label>Mode<select name="payMode"></select></label></div>
  <label>Amount (₹)<input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${v('amount')}"></label>
  <div class="row2"><label>Commission (₹)<input name="commission" type="number" inputmode="decimal" step="0.01" min="0" value="${v('commission', 0)}"></label>
  <label>Commission is<select name="commType"><option value="taken">Taken from vendor</option><option value="given">Given to vendor</option></select></label></div>
  <div class="row2"><label>Date${o.dateEditable ? '' : ' (today only)'}<input name="date" type="date" required value="${keyToIso(t.dateKey || keyOf())}" ${o.dateEditable ? `max="${keyToIso(keyOf())}"` : 'readonly'}></label>
  <label>Note (optional)<input name="note" value="${v('note')}"></label></div>
  ${o.reason ? '<label>Reason for change (sent to owner)<input name="reason" required></label>' : ''}
  <button class="btn full" type="submit">${o.submit || 'Save entry'}</button></form>`;
}
const fillSel = (sel, opts) => { const cur = sel.value; sel.innerHTML = opts.map(x => `<option value="${esc(x[0])}">${esc(x[1])}</option>`).join(''); if ([...sel.options].some(o => o.value === cur)) sel.value = cur; };
function syncForm(f, types, curVendor) {
  const vs = S.vendors.filter(v => types.includes(v.type) && (v.active !== false || v.id === curVendor)).sort(byName);
  const grp = !!f.elements.smallVendor;
  const vo = vs.filter(v => !grp || v.type !== 'small').map(v => [v.id, types.length > 1 ? `${v.name} · ${GROUPS[v.type]}` : v.name]);

}
const findTx = (col, id) => allTx().find(x => x._col === col && x.id === id);

function openEdit(col, id) {

}

}

    live() {
      if (!root) return; const ts = a => a.requestedAt?.toMillis?.() ?? Date.now();
      live(root).innerHTML = `<div class="card"><div class="gh"><b>My edit requests</b></div>${[...S.approvals].sort((a, b) => ts(b) - ts(a)).map(a => `<div class="li"><div class="l" style="white-space:normal"><b>${esc(a.vendorName)} · ${keyShort(a.dateKey)}<span class="tag ${a.status === 'approved' ? 'g' : a.status === 'rejected' ? 'r' : ''}">${a.status}</span></b>${diffHtml(a.before, a.after)}${a.decisionNote ? `<div class="muted det">Owner: ${esc(a.decisionNote)}</div>` : ''}</div></div>`).join('') || '<p class="muted" style="margin:4px 0 0">No requests.</p>'}</div>`;
    }
  };
})();

/* --- Action log --- */
function describeLog(l) {
  const b = l.before || {}, a = l.after || {};
  if (l.action === 'create' || l.action === 'delete') { const x = l.action === 'create' ? a : b; return `${x.dir === 'in' ? 'IN' : 'OUT'} ${inr(x.amount)} · ${x.mode}${x.bank ? ' ' + esc(x.bank) + '/' + esc(x.payMode) : ''}${x.commission ? ' · comm ' + inr(x.commission) + ' ' + x.commType : ''}`; }
  return diffHtml(b, a) + (l.reason ? `<div class="muted">${esc(l.reason)}</div>` : '');
}
VIEWS.log = (() => { let root;
  const F = () => S.f.log ||= { action: '', q: '' };
  const rows = () => { const f = F(), q = f.q.toLowerCase(); return S.logs.filter(l => (!f.action || l.action === f.action) && (!q || (l.vendorName || '').toLowerCase().includes(q) || (l.byName || '').toLowerCase().includes(q))); };
  return {
    init(m) { root = m; const f = F();
      m.innerHTML = `<div class="bar"><select name="action" style="margin:0;flex:1"><option value="">All actions</option>${['create', 'edit', 'void', 'restore', 'request_edit', 'approved', 'rejected', 'delete'].map(a => `<option value="${a}">${a}</option>`).join('')}</select><input name="q" placeholder="Search" value="${esc(f.q)}"><button class="btn ic" data-x="1">⬇</button></div><div id="live"></div>`;
      $('[name=action]', m).value = f.action;
      m.addEventListener('input', e => { if (e.target.name in f) { f[e.target.name] = e.target.value; VIEWS.log.live(); } });
      m.addEventListener('click', e => { if (e.target.closest('[data-x]')) download({ Log: rows().map(l => ({ Time: dt(l.ts), User: l.byName, Role: l.role, Action: l.action, Vendor: l.vendorName || '', 'Entry date': l.dateKey ? keyToStr(l.dateKey) : '', Before: JSON.stringify(l.before || {}), After: JSON.stringify(l.after || {}), Reason: l.reason || '' })) }, 'action_log'); });
    },
    live() { if (root) live(root).innerHTML = `<div class="card">${rows().slice(0, 200).map(l => `<div class="li"><div class="l" style="white-space:normal"><b><span class="tag" style="margin:0 6px 0 0">${l.action}</span>${esc(l.vendorName || '')}</b><small>${dt(l.ts)} · ${esc(l.byName)} (${l.role})${l.dateKey ? ' · entry ' + keyShort(l.dateKey) : ''}</small><div class="det">${describeLog(l)}</div></div></div>`).join('') || '<p class="muted" style="margin:0">No log entries.</p>'}</div>`; }
  };
})();

/* --- Admin: vendors --- */
VIEWS.vendors = (() => { let root;
  return {
    init(m) { root = m;
      m.innerHTML = `<div class="card"><form class="row3"><label>New vendor<input name="name" required placeholder="Name"></label><label>Group<select name="type"><option value="small">Small</option><option value="main1">Main 1</option><option value="main2">Main 2</option></select></label><button class="btn">Add</button></form></div><div id="live"></div>`;
      $('form', m).addEventListener('submit', async e => { e.preventDefault(); const f = e.target; try { await addDoc(collection(db, 'vendors'), { name: f.name.value.trim(), type: f.type.value, active: true, createdAt: serverTimestamp() }); f.name.value = ''; toast('Vendor added'); } catch (err) { toast(errMsg(err), true); } });
    },
    live() { if (root) live(root).innerHTML = ALL_TYPES.map(ty => `<div class="card"><div class="gh"><b>${GROUPS[ty]}</b></div>${S.vendors.filter(v => v.type === ty).sort(byName).map(v => `<div class="li"><div class="l"><b>${esc(v.name)}${v.active === false ? '<span class="tag r">inactive</span>' : ''}</b>${v.phone || v.note ? `<small>${esc(v.phone || '')}${v.phone && v.note ? ' · ' : ''}${esc(v.note || '')}</small>` : ''}</div><div class="acts" style="margin:0"><button class="btn sec xs" data-act="vedit" data-id="${v.id}">Edit</button><button class="btn sec xs" data-act="vtoggle" data-id="${v.id}">${v.active === false ? 'Activate' : 'Deactivate'}</button><button class="btn red xs" data-act="vdel" data-id="${v.id}">✕</button></div></div>`).join('') || '<p class="muted" style="margin:4px 0 0">None</p>'}</div>`).join(''); }
  };
})();

/* --- Admin: users --- */
let secAuth;
VIEWS.users = (() => { let root;
  return {
    init(m) { root = m;
      m.innerHTML = `<div class="card"><form><div class="row2"><label>Full name<input name="name" required></label><label>Username or email<input name="username" required autocapitalize="off"></label></div><div class="row2"><label>Password (min 6)<input name="pw" type="text" minlength="6" required></label><label>Role<select name="role"><option value="accountant">Accountant</option><option value="owner">Owner</option><option value="admin">Admin</option></select></label></div><button class="btn full">Create login</button></form></div><div id="live"></div>`;
      $('form', m).addEventListener('submit', async e => { e.preventDefault(); const f = e.target, btn = f.querySelector('button'); btn.disabled = true;
        try { const email = toEmail(f.username.value); secAuth ||= getAuth(initializeApp(firebaseConfig, 'secondary'));
          const c = await createUserWithEmailAndPassword(secAuth, email, f.pw.value); await signOut(secAuth);
          await setDoc(doc(db, 'users', c.user.uid), { name: f.name.value.trim(), username: f.username.value.trim(), email, role: f.role.value, active: true, createdAt: serverTimestamp() });
          f.reset(); toast('Login created'); } catch (err) { toast(errMsg(err), true); } finally { btn.disabled = false; } });
    },
    live() { if (root) live(root).innerHTML = `<div class="card"><div class="gh"><b>Logins</b></div>${S.users.sort(byName).map(u => `<div class="li"><div class="l"><b>${esc(u.name)}${u.active ? '' : '<span class="tag r">disabled</span>'}</b><small>${esc(u.username || u.email)}</small></div><div class="acts" style="margin:0;align-items:center"><select data-urole="${u.id}" style="width:auto;margin:0;padding:4px 6px;font-size:13px">${['accountant', 'owner', 'admin'].map(r => `<option ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select><button class="btn sec xs" data-act="utoggle" data-id="${u.id}">${u.active ? 'Disable' : 'Enable'}</button></div></div>`).join('')}<div class="fn" style="margin-top:8px">Password resets: Firebase Console → Authentication, or create a fresh login.</div></div>`; }
  };
})();

/* --- Admin: settings --- */
VIEWS.settings = (() => { let root, dirty = false;
  return {
    init(m) { root = m; dirty = false;
      m.innerHTML = `<div class="card"><div class="row2"><label>Banks (one per line)<textarea name="banks" rows="9"></textarea></label><label>Online modes (one per line)<textarea name="modes" rows="9"></textarea></label></div><button class="btn full" id="sv">Save</button><div class="fn" style="margin-top:6px">The 5-hour edit window is set inside firestore.rules.</div></div>`;
      m.addEventListener('input', () => dirty = true);
      $('#sv', m).onclick = async () => { const l = n => $(`[name=${n}]`, m).value.split('\n').map(x => x.trim()).filter(Boolean); try { await setDoc(doc(db, 'settings', 'config'), { banks: l('banks'), modes: l('modes') }); dirty = false; toast('Saved'); } catch (e) { toast(errMsg(e), true); } };
      this.live();
    },
    live() { if (root && !dirty) { $('[name=banks]', root).value = S.cfg.banks.join('\n'); $('[name=modes]', root).value = S.cfg.modes.join('\n'); } }
  };
})();

/* --- Owner: corrections (backdated entries, edit, delete) --- */
function openBackdated() {
  const m = modal(`<h3>Backdated entry</h3>${formHtml({}, { dateEditable: true, submit: 'Save backdated entry' })}`);
  const f = $('form', m); f.elements.date.value = addDays(keyToIso(keyOf()), -1);
  bindForm(f, { types: ALL_TYPES, onSubmit: async d => { if (d.dateKey > keyOf()) throw new Error('Date cannot be in the future.'); await createTx(d, true); toast('Saved'); m.close(); } });
}
VIEWS.fix = (() => { let root; const F = () => S.f.fix ||= { from: addDays(keyToIso(keyOf()), -6), to: keyToIso(keyOf()), vendor: '' };
  const rows = () => { const f = F(); const fk = f.from ? isoToKey(f.from) : 0, tk = f.to ? isoToKey(f.to) : 99999999; return sortTx(allTx().filter(t => t.dateKey >= fk && t.dateKey <= tk && (!f.vendor || t.vendorId === f.vendor))); };
  return {
    init(m) { root = m; const f = F();
      m.innerHTML = `<div class="fn" style="margin-top:0">Fix or delete any entry, or add one for a past date. Every change is recorded in the Action log.</div>
      <div class="bar"><input type="date" name="from" value="${f.from}"><input type="date" name="to" value="${f.to}"><button class="btn ic" data-add="1">+ Backdated</button></div>
      <div class="bar"><select name="vendor" style="margin:0"></select></div><div id="live"></div>`;
      VIEWS.fix.sync = () => { fillSel($('[name=vendor]', m), [['', 'All vendors'], ...[...S.vendors].sort(byName).map(v => [v.id, `${v.name} · ${SHORT[v.type]}`])]); $('[name=vendor]', m).value = f.vendor; };
      VIEWS.fix.sync();
      m.addEventListener('input', e => { const n = e.target.name; if (n && n in f) { f[n] = e.target.value; VIEWS.fix.live(); } });
      m.addEventListener('click', e => { if (e.target.closest('[data-add]')) openBackdated(); });
    },
    live() { if (!root) return; const r = rows(); live(root).innerHTML = `<div class="card"><div class="gh"><b>${r.length} entries</b></div>${txList(r.slice(0, 200), { del: true })}</div>`; }
  };
})();

/* --- combined tabs (keep the bottom bar at 5 items) --- */
const combo = (subs, memo) => { let root, area, cur;
  const show = k => { cur = k; S.f[memo] = k; root.querySelectorAll('[data-sub]').forEach(b => b.classList.toggle('on', b.dataset.sub === k));
    const box = document.createElement('div'); area.replaceChildren(box); VIEWS[k].init(box); VIEWS[k].live?.(); };
  return {
    init(m) { root = m; m.innerHTML = `<div class="sub">${subs.map(([k, n]) => `<button data-sub="${k}">${n}${k === 'approvals' ? '<span class="bd2" id="bd2" hidden></span>' : ''}</button>`).join('')}</div><div id="area"></div>`;
      area = $('#area', m); $('.sub', m).onclick = e => { const b = e.target.closest('[data-sub]'); if (b) show(b.dataset.sub); }; show(S.f[memo] || subs[0][0]); },
    live() { VIEWS[cur]?.live?.(); }
  };
};
VIEWS.review = combo([['approvals', 'Approvals'], ['fix', 'Corrections'], ['log', 'Action log']], 'reviewSub');
VIEWS.more = combo([['settings', 'Settings'], ['log', 'Action log']], 'moreSub');

/* ================= shell / auth ================= */
const toEmail = u => { u = u.trim(); return u.includes('@') ? u : u.toLowerCase().replace(/\s+/g, '') + '@ledger.local'; };
const TABS = {
  accountant: [['entry', 'Entry', 'entry'], ['ledger', 'Balances', 'ledger'], ['tx', 'History', 'clock'], ['requests', 'My edits', 'edits']],
  owner: [['entry', 'Add entry', 'entry'], ['ledger', 'Balances', 'ledger'], ['dash', 'Dashboard', 'dash'], ['tx', 'Transactions', 'tx'], ['review', 'Review', 'review']],
  admin: [['ledger', 'Balances', 'ledger'], ['tx', 'Entries', 'tx'], ['vendors', 'Vendors', 'vendors'], ['users', 'Users', 'users'], ['more', 'More', 'more']]
};

function showLogin() {
  app.innerHTML = `<div class="login"><div class="card"><h2>Ledger Desk</h2><form id="lf"><label>Username or email<input name="u" required autocapitalize="off" autocomplete="username"></label><label>Password<input name="p" type="password" required autocomplete="current-password"></label><button class="btn full">Log in</button><p class="out" id="lm">${esc(S.loginMsg)}</p></form></div></div>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); const f = e.target; S.loginMsg = ''; $('#lm').textContent = '';
    try { await signInWithEmailAndPassword(auth, toEmail(f.u.value), f.p.value); } catch (err) { $('#lm').textContent = 'Login failed. Check username and password.'; } };
}
function showApp() {
  app.innerHTML = `<div id="shell"><header><div><b>Ledger Desk</b><small>${esc(S.me.name)} · ${S.me.role}</small></div><button class="ghost" id="lo">Log out</button></header><main id="main"></main>
  <nav id="nav">${TABS[role()].map(([k, n, i]) => `<button data-tab="${k}"><svg viewBox="0 0 24 24">${ICON[i]}</svg><span>${n}</span>${k === 'review' ? '<span class="bd" hidden></span>' : ''}</button>`).join('')}</nav></div>`;
  $('#lo').onclick = () => signOut(auth);
  $('#nav').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); };
  go(TABS[role()][0][0]);
}
function go(tab) {
  S.tab = tab; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const m = $('#main'); m.innerHTML = ''; VIEWS[tab].init(m); VIEWS[tab].live?.(); m.scrollTop = 0;
}
let raf; function refresh() { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {
  const n = S.approvals.filter(a => a.status === 'pending').length;
  document.querySelectorAll('nav .bd, #bd2').forEach(b => { b.textContent = n; b.hidden = !n; });
  if (S.tab && VIEWS[S.tab]) VIEWS[S.tab].live?.(); }); }

function listen(q, key) { S.unsubs.push(onSnapshot(q, snap => { S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.ready[key] = true; refresh(); }, err => toast('Cannot read ' + key + ': ' + err.message, true))); }
function startSession() {
  const r = role();
  S.unsubs.push(onSnapshot(doc(db, 'settings', 'config'), s => { if (s.exists()) S.cfg = { banks: s.data().banks?.length ? s.data().banks : DEFAULT_BANKS, modes: s.data().modes?.length ? s.data().modes : DEFAULT_MODES }; refresh(); }));
  if (r === 'accountant') {
    listen(query(collection(db, 'vendors'), where('type', '==', 'small')), 'vendors');
    listen(collection(db, 'tx_small'), 'small');
    listen(query(collection(db, 'approvals'), where('requestedBy', '==', S.user.uid)), 'approvals');
  } else {
    listen(collection(db, 'vendors'), 'vendors'); listen(collection(db, 'tx_small'), 'small'); listen(collection(db, 'tx_main'), 'main');
    listen(collection(db, 'approvals'), 'approvals'); listen(query(collection(db, 'logs'), orderBy('ts', 'desc'), limit(1000)), 'logs');
    if (r === 'admin') listen(collection(db, 'users'), 'users');
  }
}
function teardown() { S.unsubs.forEach(u => u()); Object.assign(S, { unsubs: [], vendors: [], small: [], main: [], approvals: [], logs: [], users: [], f: {}, tab: null, ready: {} }); }

onAuthStateChanged(auth, async u => {
  teardown();
  if (!u) { S.user = S.me = null; showLogin(); return; }
  try {
    const s = await getDoc(doc(db, 'users', u.uid));
    if (!s.exists() || !s.data().active) { S.loginMsg = 'This login is not set up or is disabled. Contact the admin.'; await signOut(auth); return; }
    S.user = u; S.me = s.data(); startSession(); showApp();
  } catch (e) { S.loginMsg = 'Could not load your profile: ' + e.message; await signOut(auth); }
});
</script>
</body>
